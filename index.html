<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Placeholder SEO — diisi JS saat load -->
<title>Memuat…</title>
<meta name="description" content="">
<meta name="keywords" content="">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="ai-content-declaration" content="human-authored, editorially-reviewed">
<meta name="GPTBot" content="index, follow">
<meta name="ClaudeBot" content="index, follow">
<meta name="PerplexityBot" content="index, follow">
<link rel="canonical" href="">

<!-- OG -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="">
<meta property="og:title" content="">
<meta property="og:description" content="">
<meta property="og:url" content="">
<meta property="og:image" content="">
<meta name="twitter:card" content="summary_large_image">

<!-- Structured Data — diisi JS -->
<script type="application/ld+json" id="ld-json">{"@context":"https://schema.org"}</script>

<link rel="preconnect" href="https://images.unsplash.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  .skip-link { position:absolute; left:-9999px; }
  .skip-link:focus { left:1rem; top:1rem; z-index:100; background:#2563eb; color:#fff; padding:.5rem 1rem; border-radius:.375rem; }
  .skeleton { background: linear-gradient(90deg,#e5e7eb 25%,#f3f4f6 50%,#e5e7eb 75%); background-size:200% 100%; animation: sk 1.5s infinite; }
  @keyframes sk { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
</style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">

<a href="#main-content" class="skip-link">Langsung ke konten utama</a>

<!-- ============ HEADER ============ -->
<header class="bg-white border-b border-gray-200 sticky top-0 z-50" role="banner">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
    <a href="/" id="siteName" class="text-xl font-bold text-blue-600 tracking-tight">Memuat…</a>
    <nav id="mainNav" class="hidden md:flex space-x-6 text-sm font-medium text-gray-600" aria-label="Navigasi utama"></nav>
    <button id="menuBtn" class="md:hidden p-2 text-gray-600" aria-label="Buka menu" aria-expanded="false">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </div>
  <nav id="mobileNav" class="md:hidden hidden border-t border-gray-200 bg-white px-4 py-3 space-y-2" aria-label="Navigasi mobile"></nav>
</header>

<main id="main-content" class="max-w-4xl mx-auto px-4 sm:px-6 py-8" role="main">

  <!-- HERO -->
  <section aria-labelledby="featured-heading" class="mb-10">
    <h2 id="featured-heading" class="sr-only">Artikel Unggulan</h2>
    <div id="heroSkeleton" class="rounded-2xl h-64 sm:h-80 md:h-96 skeleton"></div>
    <article id="heroCard" class="hidden relative rounded-2xl overflow-hidden shadow-sm group">
      <a id="heroLink" href="#" class="block">
        <div class="w-full h-64 sm:h-80 md:h-96 relative bg-gray-200">
          <img id="heroImg" src="" alt="" class="w-full h-full object-cover transition duration-300 group-hover:scale-105" width="1200" height="630" fetchpriority="high">
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent" aria-hidden="true"></div>
        </div>
        <div class="absolute bottom-0 left-0 p-6 text-white w-full">
          <span id="heroCat" class="inline-block px-2 py-1 bg-blue-600 text-[10px] font-bold uppercase rounded mb-2"></span>
          <h3 id="heroTitle" class="text-xl sm:text-2xl md:text-3xl font-bold leading-tight mb-2 group-hover:underline decoration-2 underline-offset-4"></h3>
          <p id="heroExcerpt" class="text-gray-300 text-sm line-clamp-2 hidden sm:block"></p>
          <time id="heroDate" datetime="" class="text-xs text-gray-300 mt-2 block"></time>
        </div>
      </a>
    </article>
  </section>

  <!-- ARTICLES -->
  <section aria-labelledby="latest-heading">
    <div class="flex items-center justify-between mb-6">
      <h2 id="latest-heading" class="text-lg font-bold text-gray-900">Artikel Terbaru</h2>
      <a href="/artikel" class="text-sm text-blue-600 font-medium hover:underline">Lihat Semua</a>
    </div>
    <div id="articlesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
  </section>

  <!-- FAQ -->
  <section id="faqSection" class="hidden mt-14 bg-white rounded-2xl border border-gray-100 p-6 sm:p-8">
    <h2 class="text-xl font-bold text-gray-900 mb-4">Pertanyaan yang Sering Diajukan</h2>
    <dl id="faqList" class="space-y-4"></dl>
  </section>

</main>

<!-- ============ FOOTER ============ -->
<footer class="border-t border-gray-200 mt-16 bg-white" role="contentinfo">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 py-8 flex flex-col sm:flex-row justify-between items-center text-sm text-gray-500">
    <p>&copy; <span id="year"></span> <span id="footerName">—</span>. All rights reserved.</p>
    <nav id="footerNav" aria-label="Navigasi footer" class="flex space-x-4 mt-4 sm:mt-0"></nav>
  </div>
</footer>

<script>
/* ============================================================
   UTIL
   ============================================================ */
const $ = (s) => document.querySelector(s);
const fmtDate = (iso) => {
  if (!iso) return '';
  try {
    return new Date(iso).toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' });
  } catch { return iso; }
};
const esc = (s='') => String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

/* ============================================================
   RENDER FUNCTIONS
   ============================================================ */
function renderNav(items) {
  const html = items.map(n =>
    `<a href="${esc(n.url)}" class="${n.active ? 'text-blue-600' : 'hover:text-blue-600 transition'}"${n.active?' aria-current="page"':''}>${esc(n.label)}</a>`
  ).join('');
  $('#mainNav').innerHTML = html;
  $('#mobileNav').innerHTML = html.replace(/class="[^"]*"/g, 'class="block py-1 text-gray-700 hover:text-blue-600"');
}

function renderHero(hero) {
  $('#heroSkeleton').classList.add('hidden');
  $('#heroCard').classList.remove('hidden');
  $('#heroLink').href = hero.url || '#';
  $('#heroLink').setAttribute('aria-label', `Baca artikel: ${hero.title}`);
  $('#heroImg').src = hero.image;
  $('#heroImg').alt = hero.imageAlt || hero.title;
  $('#heroCat').textContent = hero.category || '';
  $('#heroTitle').textContent = hero.title || '';
  $('#heroExcerpt').textContent = hero.excerpt || '';
  const t = $('#heroDate');
  t.dateTime = hero.date || '';
  t.textContent = fmtDate(hero.date) + ' · 8 menit baca';
}

function renderArticles(list) {
  $('#articlesGrid').innerHTML = list.map(a => `
    <article class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition group">
      <a href="${esc(a.url)}" class="block" aria-label="Baca: ${esc(a.title)}">
        <div class="h-40 bg-gray-200 overflow-hidden">
          <img src="${esc(a.image)}" alt="${esc(a.imageAlt)}" loading="lazy" width="600" height="400"
               class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
        </div>
        <div class="p-4">
          <span class="text-[10px] font-bold text-blue-600 uppercase tracking-wide">${esc(a.category)}</span>
          <h3 class="font-bold text-gray-900 mt-1 mb-2 leading-snug line-clamp-2 group-hover:text-blue-600 transition">${esc(a.title)}</h3>
          <p class="text-gray-500 text-xs line-clamp-2">${esc(a.excerpt)}</p>
          <time datetime="${esc(a.date)}" class="text-[10px] text-gray-400 mt-2 block">${fmtDate(a.date)}</time>
        </div>
      </a>
    </article>
  `).join('');
}

function renderFaq(faq) {
  if (!faq?.length) { $('#faqSection').classList.add('hidden'); return; }
  $('#faqSection').classList.remove('hidden');
  $('#faqList').innerHTML = faq.map(f => `
    <div>
      <dt class="font-semibold text-gray-900">${esc(f.q)}</dt>
      <dd class="text-gray-600 text-sm mt-1">${esc(f.a)}</dd>
    </div>
  `).join('');
}

function renderFooter(siteName, items) {
  $('#footerName').textContent = siteName;
  $('#footerNav').innerHTML = items.map(n =>
    `<a href="${esc(n.url)}" class="hover:text-blue-600">${esc(n.label)}</a>`
  ).join('');
}

/* ============================================================
   SEO META + JSON-LD
   ============================================================ */
function applySEO(data) {
  const { site, seo, hero, articles, faq } = data;

  document.title = seo.title || site.name;
  $('#siteName').textContent = site.name;
  $('#footerName').textContent = site.name;

  const set = (sel, attr, val) => {
    const el = document.querySelector(sel);
    if (el) el.setAttribute(attr, val || '');
  };
  set('meta[name="description"]', 'content', seo.description);
  set('meta[name="keywords"]', 'content', seo.keywords);
  set('link[rel="canonical"]', 'href', seo.canonical);
  set('meta[property="og:title"]', 'content', seo.title);
  set('meta[property="og:description"]', 'content', seo.description);
  set('meta[property="og:site_name"]', 'content', site.name);
  set('meta[property="og:url"]', 'content', seo.canonical);
  set('meta[property="og:image"]', 'content', seo.ogImage);
  set('meta[name="twitter:title"]', 'content', seo.title);
  set('meta[name="twitter:description"]', 'content', seo.description);
  set('meta[name="twitter:image"]', 'content', seo.ogImage);

  // JSON-LD dinamis
  const baseUrl = (seo.canonical || location.origin).replace(/\/$/, '');
  const ld = {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": baseUrl + "/#website",
        "url": baseUrl + "/",
        "name": site.name,
        "description": seo.description,
        "inLanguage": "id-ID",
        "publisher": { "@id": baseUrl + "/#organization" },
        "potentialAction": {
          "@type": "SearchAction",
          "target": baseUrl + "/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      },
      {
        "@type": "Organization",
        "@id": baseUrl + "/#organization",
        "name": site.name,
        "url": baseUrl + "/",
        "logo": { "@type": "ImageObject", "url": seo.ogImage, "width": 512, "height": 512 }
      },
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Home", "item": baseUrl + "/" },
          { "@type": "ListItem", "position": 2, "name": "Artikel Terbaru", "item": baseUrl + "/artikel" }
        ]
      },
      {
        "@type": "ItemList",
        "name": "Artikel Terbaru",
        "itemListElement": articles.map((a, i) => ({
          "@type": "ListItem",
          "position": i + 1,
          "url": a.url.startsWith('http') ? a.url : baseUrl + a.url,
          "name": a.title
        }))
      }
    ]
  };

  if (faq?.length) {
    ld["@graph"].push({
      "@type": "FAQPage",
      "mainEntity": faq.map(f => ({
        "@type": "Question",
        "name": f.q,
        "acceptedAnswer": { "@type": "Answer", "text": f.a }
      }))
    });
  }

  // Hero article (NewsArticle)
  if (hero?.title) {
    ld["@graph"].push({
      "@type": "NewsArticle",
      "headline": hero.title,
      "description": hero.excerpt,
      "image": [hero.image],
      "datePublished": hero.date,
      "dateModified": hero.date,
      "author": { "@type": "Organization", "name": site.name },
      "publisher": { "@id": baseUrl + "/#organization" },
      "mainEntityOfPage": hero.url.startsWith('http') ? hero.url : baseUrl + hero.url
    });
  }

  $('#ld-json').textContent = JSON.stringify(ld, null, 2);
}

/* ============================================================
   BOOT
   ============================================================ */
(async function boot() {
  $('#year').textContent = new Date().getFullYear();
  try {
    const res = await fetch('content.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('content.json tidak ditemukan');
    const data = await res.json();

    applySEO(data);
    renderNav(data.nav || []);
    renderHero(data.hero || {});
    renderArticles(data.articles || []);
    renderFaq(data.faq || []);
    renderFooter(data.site.name, data.footer || []);
  } catch (e) {
    console.error(e);
    document.title = 'Portal Artikel';
    $('#siteName').textContent = 'Portal Artikel';
    $('#heroSkeleton').innerHTML = `<div class="rounded-2xl bg-red-50 border border-red-200 p-6 text-center text-red-700">
      Gagal memuat konten. Jalankan CMS untuk membuat <code>content.json</code>.</div>`;
  }
})();

/* Mobile menu toggle */
$('#menuBtn').addEventListener('click', () => {
  const nav = $('#mobileNav');
  const open = !nav.classList.contains('hidden');
  nav.classList.toggle('hidden');
  $('#menuBtn').setAttribute('aria-expanded', String(!open));
});
</script>
</body>
</html>
