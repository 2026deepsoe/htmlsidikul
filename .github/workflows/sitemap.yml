name: Generate Sitemap

on:
  push:
    paths:
      - 'content.json'
      - '.github/workflows/sitemap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate sitemap.xml
        run: |
          node -e '
          const fs = require("fs");
          const c = JSON.parse(fs.readFileSync("content.json","utf8"));
          const base = (c.seo.canonical || "https://username.github.io").replace(/\/$/,"");
          const urls = ["/", "/artikel"]
            .concat((c.articles||[]).map(a=>a.url))
            .filter(Boolean)
            .map(u => u.startsWith("http") ? u : base + (u.startsWith("/") ? u : "/" + u));

          const xml = `<?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
          ${urls.map(u=>`  <url><loc>${u}</loc><changefreq>weekly</changefreq></url>`).join("\n")}
          </urlset>`;
          fs.writeFileSync("sitemap.xml", xml);
          console.log("Sitemap generated:", urls.length, "URLs");
          '

      - name: Commit sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --staged --quiet || git commit -m "chore: update sitemap [skip ci]"
          git push
